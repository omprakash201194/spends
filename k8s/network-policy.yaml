---
# Allow frontend → backend (port 8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spends-backend-ingress
  namespace: homelab
  labels:
    app: spends-backend
    env: homelab
    managed-by: kubectl
spec:
  podSelector:
    matchLabels:
      app: spends-backend
  policyTypes:
    - Ingress
  ingress:
    # nginx ingress controller → backend
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    # frontend → backend (same namespace)
    - from:
        - podSelector:
            matchLabels:
              app: spends-frontend
      ports:
        - port: 8080

---
# Allow backend → postgres (port 5432) only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spends-backend-egress
  namespace: homelab
  labels:
    app: spends-backend
    env: homelab
    managed-by: kubectl
spec:
  podSelector:
    matchLabels:
      app: spends-backend
  policyTypes:
    - Egress
  egress:
    # Backend → PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    # Backend → kube-dns (required for service resolution)
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Backend → external APIs (Anthropic, Google OAuth, mail) — allow all egress on 443/587
    - to: []
      ports:
        - port: 443
        - port: 587
