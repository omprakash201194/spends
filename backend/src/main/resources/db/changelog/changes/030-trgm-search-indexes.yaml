databaseChangeLog:
  - changeSet:
      id: 030-trgm-search-indexes
      author: system
      changes:
        - sql:
            sql: >
              -- Enable pg_trgm for trigram similarity — makes ILIKE fast on large text columns.
              -- Required before creating gin_trgm_ops indexes.
              CREATE EXTENSION IF NOT EXISTS pg_trgm;

              -- GIN trigram index on raw_remarks (used by transaction search and TAG widget filter)
              CREATE INDEX IF NOT EXISTS idx_txn_remarks_trgm
                ON financial_transaction
                USING GIN (LOWER(COALESCE(raw_remarks, '')) gin_trgm_ops);

              -- GIN trigram index on merchant_name (used by transaction search)
              CREATE INDEX IF NOT EXISTS idx_txn_merchant_trgm
                ON financial_transaction
                USING GIN (LOWER(COALESCE(merchant_name, '')) gin_trgm_ops);
